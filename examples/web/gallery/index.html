<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Render Gallery - block-model-renderer</title>
<meta name="description" content="Batch-render Minecraft blocks straight to canvases, with live animation players. Filter by name or namespace, or render every block in the pack.">
<link rel="canonical" href="https://block-model-renderer.ewanhowell.com/gallery/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://block-model-renderer.ewanhowell.com/gallery/">
<meta property="og:title" content="Minecraft Render Gallery - block-model-renderer">
<meta property="og:description" content="Batch-render Minecraft blocks straight to canvases, with live animation players. Filter by name or namespace, or render every block in the pack.">
<link rel="icon" type="image/webp" sizes="16x16" href="https://ewanhowell.com/assets/images/logo/logo_16.webp">
<link rel="icon" type="image/webp" sizes="32x32" href="https://ewanhowell.com/assets/images/logo/logo_32.webp">
<link rel="stylesheet" href="../style.css">
<style>
  main { overflow-y: auto; }
  #status { color: #f88; font-size: 12px; overflow-wrap: anywhere; }
  #progress { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--accent); z-index: 1; }
  #grid { display: grid; gap: 12px; padding: 14px; }
  #empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 24px 0; }
  figure {
    margin: 0; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 10px; text-align: center;
  }
  figure canvas { image-rendering: pixelated; max-width: 100%; height: auto; }
  figcaption { color: var(--muted); font-size: 11px; margin-top: 6px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<aside>
  <h1><small>block-model-renderer</small> Render Gallery</h1>

  <section>
    <h2>Pack</h2>
    <div class="row">
      <button id="release">Release</button>
      <button id="snapshot">Snapshot</button>
    </div>
    <button id="open">Select Resource Pack or Mod…</button>
    <input type="file" id="packfile" accept=".zip,.jar">
    <span id="packstatus">Loading…</span>
  </section>

  <section>
    <h2>Render</h2>
    <textarea id="ids" rows="5">chest, magma_block, sea_lantern, campfire, crafting_table, prismarine, conduit, blast_furnace, jack_o_lantern, white_banner, enchanting_table, beacon</textarea>
    <div class="fields">
      <label for="size">Size</label>
      <select id="size">
        <option>64</option>
        <option>128</option>
        <option selected>256</option>
        <option>512</option>
      </select>
      <label for="count">Count</label>
      <input type="number" id="count" value="24" min="1">
    </div>
    <div class="row">
      <button id="randomise" disabled>Randomise</button>
      <button id="renderall" disabled>Render All</button>
    </div>
    <button id="render" class="primary" disabled>Render</button>
  </section>

  <section>
    <h2>Filters</h2>
    <div class="fields">
      <label for="fnamespace">Namespace</label>
      <select id="fnamespace">
        <option value="">All</option>
      </select>
      <label for="fstarts">Starts with</label>
      <input type="text" id="fstarts" placeholder="oak_, stripped_">
      <label for="fends">Ends with</label>
      <input type="text" id="fends" placeholder="_log, _stairs">
      <label for="fcontains">Contains</label>
      <input type="text" id="fcontains" placeholder="copper">
    </div>
    <label class="check" id="fanimatedrow"><input type="checkbox" id="fanimated"> Animated only</label>
  </section>

  <section>
    <h2>Animations</h2>
    <label class="check"><input type="checkbox" id="animenable" checked> Enable animations</label>
    <button id="playpause" hidden>Pause All</button>
  </section>
  <span id="status"></span>
</aside>

<button id="sidebartoggle" class="menu-button" aria-label="Menu">
  <svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="2" y1="3.5" x2="14" y2="3.5"/>
    <line x1="2" y1="8" x2="14" y2="8"/>
    <line x1="2" y1="12.5" x2="14" y2="12.5"/>
  </svg>
</button>
<div id="sidebarbackdrop"></div>

<main>
  <div id="grid"></div>
</main>
<div id="progress"></div>

<script>
  document.getElementById("sidebartoggle").addEventListener("click", () => document.body.classList.add("sidebar-open"))
  document.getElementById("sidebarbackdrop").addEventListener("click", () => document.body.classList.remove("sidebar-open"))
</script>

<script type="module">
  const POOL = Math.max(2, Math.min(8, (navigator.hardwareConcurrency ?? 4) - 2))
  const absNow = () => performance.timeOrigin + performance.now()
  let clockStart = absNow()
  const workers = Array.from({ length: POOL }, () => {
    const worker = new Worker("worker.js", { type: "module" })
    worker.postMessage({ type: "clock", clockStart })
    return worker
  })
  const workerReady = workers.map(() => false)
  const workerBusy = workers.map(() => false)
  const broadcast = msg => { for (const w of workers) w.postMessage(msg) }

  const $ = id => document.getElementById(id)

  let channel = null
  let userFile = null
  let blockIds = null
  let assetsToken = 0
  const assetsWaiters = new Map()
  const pending = new Map()

  let seq = 0
  let running = false
  let playing = true
  let animatedCount = 0
  let keyCounter = 0
  let dispatchMore = null

  const keyOf = new Map()
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      const owner = keyOf.get(entry.target)
      owner?.worker.postMessage({ type: "visible", key: owner.key, visible: entry.isIntersecting })
    }
  })

  workers.forEach((worker, index) => worker.addEventListener("message", e => {
    const m = e.data
    if (m.type === "progress") {
      if (index === 0) $("packstatus").textContent = `Downloading ${m.ver}… ${(m.got / 1048576).toFixed(0)}/${(m.total / 1048576).toFixed(0)}MB`
    } else if (m.type === "assets") {
      const waiter = assetsWaiters.get(`${m.token}:${index}`)
      assetsWaiters.delete(`${m.token}:${index}`)
      waiter?.(m)
    } else if (m.type === "rendered") {
      const callback = pending.get(m.key)
      pending.delete(m.key)
      callback?.(m)
    }
  }))

  function clear() {
    observer.disconnect()
    keyOf.clear()
    animatedCount = 0
    $("grid").replaceChildren()
    $("playpause").hidden = true
  }

  const stopRun = () => {
    dispatchMore = null
    broadcast({ type: "seq", seq: ++seq })
  }

  async function loadAssets(chan) {
    $("status").textContent = ""
    $("release").disabled = $("snapshot").disabled = true
    stopRun()
    clear()
    const token = ++assetsToken
    workerReady.fill(false)
    const ask = index => new Promise(resolve => {
      assetsWaiters.set(`${token}:${index}`, resolve)
      workers[index].postMessage({ type: "assets", token, channel: chan, file: userFile })
    })
    const first = await ask(0)
    if (token !== assetsToken) return false
    $("release").disabled = $("snapshot").disabled = false
    if (first.error) {
      $("packstatus").textContent = "Pack failed"
      $("status").textContent = first.error
      return false
    }
    workerReady[0] = true
    for (let i = 1; i < workers.length; i++) {
      ask(i).then(m => {
        if (token !== assetsToken || m.error) return
        workerReady[i] = true
        dispatchMore?.()
      })
    }
    blockIds = { ids: first.ids, namespaces: first.namespaces }
    channel = chan
    $("packstatus").textContent = ""
    $("render").disabled = $("randomise").disabled = $("renderall").disabled = false
    $("release").classList.toggle("active", chan === "release")
    $("snapshot").classList.toggle("active", chan === "snapshot")
    $("open").textContent = userFile ? userFile.name : "Select Resource Pack or Mod…"
    syncNamespaces()
    return true
  }

  $("release").addEventListener("click", () => loadAssets("release"))
  $("snapshot").addEventListener("click", () => loadAssets("snapshot"))
  $("open").addEventListener("click", () => $("packfile").click())
  $("packfile").addEventListener("change", () => {
    const file = $("packfile").files[0]
    if (!file) return
    userFile = file
    loadAssets(channel)
  })

  function setRunning(on) {
    running = on
    for (const id of ["ids", "size", "count", "randomise", "renderall", "release", "snapshot", "open"]) $(id).disabled = on
    $("render").textContent = on ? "Cancel" : "Render"
    if (!on) {
      $("packstatus").textContent = ""
      $("playpause").hidden = !animatedCount
      $("progress").style.width = "0"
    }
  }

  function showEmpty(message) {
    const empty = document.createElement("div")
    empty.id = "empty"
    empty.textContent = message
    $("grid").append(empty)
  }

  function render(requested, target) {
    const run = ++seq
    broadcast({ type: "seq", seq: run })
    clear()
    setRunning(true)
    $("status").textContent = ""
    const size = +$("size").value
    const animate = $("animenable").checked
    const animatedOnly = animate && $("fanimated").checked
    $("grid").style.gridTemplateColumns = `repeat(auto-fill, minmax(min(${size + 22}px, 100%), 1fr))`

    const known = new Set(blockIds.ids)
    const exists = id => known.has(id) || known.has(id.startsWith("minecraft:") ? id.slice(10) : `minecraft:${id}`)
    const ids = requested.filter(exists)
    if (ids.length < requested.length && ids.length) {
      $("status").textContent = `Skipped ${requested.length - ids.length} ID(s) not in the pack`
    }

    let next = 0
    let done = 0
    let active = 0
    const rendered = []
    const targetMet = () => target && rendered.length >= target

    const finish = () => {
      if (run !== seq) return
      dispatchMore = null
      if (target) $("ids").value = rendered.join(", ")
      if (!$("grid").children.length) {
        showEmpty(requested.length && !ids.length
          ? "None of the requested IDs were found in the loaded pack"
          : "No matches were found for the current filters")
      }
      setRunning(false)
    }

    const progress = () => {
      if (target) {
        $("progress").style.width = rendered.length / Math.min(target, ids.length) * 100 + "%"
        $("packstatus").textContent = `Rendering ${rendered.length}/${target}…`
      } else {
        $("progress").style.width = done / ids.length * 100 + "%"
        if (ids.length > 50) $("packstatus").textContent = `Rendering ${done}/${ids.length}…`
      }
    }

    const dispatch = () => {
      if (run !== seq) return
      for (let i = 0; i < workers.length; i++) {
        if (next >= ids.length || targetMet()) break
        if (!workerReady[i] || workerBusy[i]) continue
        const id = ids[next++]
        const worker = workers[i]
        workerBusy[i] = true
        active++
        const figure = document.createElement("figure")
        const caption = document.createElement("figcaption")
        caption.textContent = id
        const canvas = document.createElement("canvas")
        canvas.style.width = canvas.style.height = size + "px"
        figure.append(canvas, caption)
        $("grid").append(figure)
        const key = ++keyCounter
        pending.set(key, m => {
          workerBusy[i] = false
          active--
          if (run !== seq) {
            m.bitmap?.close()
            return
          }
          done++
          if (m.error) {
            caption.textContent = `${id}: ${m.error}`
            canvas.remove()
          } else if ((animatedOnly && !m.animates) || targetMet()) {
            m.bitmap?.close()
            figure.remove()
          } else {
            rendered.push(id)
            canvas.width = canvas.height = size
            canvas.getContext("2d").drawImage(m.bitmap, 0, 0)
            m.bitmap.close()
            if (m.animates && animate) {
              const live = document.createElement("canvas")
              live.style.width = live.style.height = size + "px"
              canvas.replaceWith(live)
              const offscreen = live.transferControlToOffscreen()
              worker.postMessage({ type: "animate", seq: run, key, id, size, canvas: offscreen }, [offscreen])
              figure.classList.add("animated")
              animatedCount++
              keyOf.set(live, { worker, key })
              observer.observe(live)
            }
          }
          progress()
          if ((next >= ids.length || targetMet()) && !active) finish()
          else dispatch()
        })
        worker.postMessage({ type: "render", seq: run, key, id, size })
      }
    }

    if (!ids.length) return finish()
    dispatchMore = dispatch
    dispatch()
  }

  const listOf = id => $(id).value.split(",").map(s => s.trim()).filter(Boolean)

  function filterPredicate() {
    const starts = listOf("fstarts")
    const ends = listOf("fends")
    const contains = listOf("fcontains")
    const namespace = $("fnamespace").value
    return id => {
      const i = id.indexOf(":")
      const ns = i === -1 ? "minecraft" : id.slice(0, i)
      const name = i === -1 ? id : id.slice(i + 1)
      if (starts.length && !starts.some(s => name.startsWith(s))) return false
      if (ends.length && !ends.some(s => name.endsWith(s))) return false
      if (contains.length && !contains.some(s => name.includes(s))) return false
      if (namespace && ns !== namespace) return false
      return true
    }
  }

  const renderFromInput = () => {
    const ids = $("ids").value.split(/[\n,]/).map(s => s.trim()).filter(Boolean).filter(filterPredicate())
    const count = Math.max(1, +$("count").value || ids.length)
    render(ids.slice(0, count))
  }

  $("render").addEventListener("click", () => {
    if (running) {
      stopRun()
      setRunning(false)
    } else {
      renderFromInput()
    }
  })
  $("ids").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault()
      renderFromInput()
    }
  })

  function syncNamespaces() {
    const { namespaces } = blockIds
    const select = $("fnamespace")
    const previous = select.value
    select.replaceChildren(
      Object.assign(document.createElement("option"), { value: "", textContent: "All" }),
      ...namespaces.map(ns => Object.assign(document.createElement("option"), { value: ns, textContent: ns }))
    )
    if (namespaces.includes(previous)) select.value = previous
    const solo = namespaces.length < 2
    select.hidden = solo
    document.querySelector('label[for="fnamespace"]').hidden = solo
    if (solo) select.value = ""
  }

  $("randomise").addEventListener("click", () => {
    const ids = blockIds.ids.filter(filterPredicate())
    if (!ids.length) {
      $("status").textContent = "No blocks match the filters"
      return
    }
    const count = Math.max(1, Math.min(+$("count").value || 24, ids.length))
    if ($("animenable").checked && $("fanimated").checked) {
      for (let i = ids.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1))
        ;[ids[i], ids[j]] = [ids[j], ids[i]]
      }
      render(ids, count)
      return
    }
    const picks = new Set()
    while (picks.size < count) {
      picks.add(ids[Math.floor(Math.random() * ids.length)])
    }
    $("ids").value = Array.from(picks).join(", ")
    renderFromInput()
  })

  $("renderall").addEventListener("click", () => {
    const ids = blockIds.ids.filter(filterPredicate())
    if (!ids.length) {
      $("status").textContent = "No blocks match the filters"
      return
    }
    $("count").value = ids.length
    $("ids").value = ids.join(", ")
    renderFromInput()
  })

  $("animenable").addEventListener("change", () => {
    $("fanimatedrow").hidden = !$("animenable").checked
  })

  let pausedAt = null
  $("playpause").addEventListener("click", () => {
    playing = !playing
    if (playing) {
      clockStart += absNow() - pausedAt
      broadcast({ type: "playing", playing: true, clockStart })
    } else {
      pausedAt = absNow()
      broadcast({ type: "playing", playing: false })
    }
    $("playpause").textContent = playing ? "Pause All" : "Play All"
  })

  addEventListener("pagehide", stopRun)

  loadAssets("release").then(ok => {
    if (ok) renderFromInput()
  })
</script>
</body>
</html>
